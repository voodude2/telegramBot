name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax Check
        working-directory: backend
        run: npm run lint

      - name: Run Tests
        working-directory: backend
        env:
          NODE_ENV: test
          # The app no longer crashes on missing credentials, so these only keep
          # the suite from exercising the "unconfigured" branch everywhere.
          GEMINI_API_KEY: "dummy_key"
          MEM0_API_KEY: "dummy_key"
          TELEGRAM_BOT_TOKEN: "dummy_key"
          JWT_SECRET: "ci_only_secret_not_used_in_any_deployment"
        run: npm test

  deploy:
    name: Trigger Render Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK_URL }}
        run: |
          set -euo pipefail
          # --fail so a rejected hook fails the job. Without it curl exits 0 on an
          # HTTP error and a broken deploy reports as green.
          if [ -z "$BACKEND_HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; fi
          echo "Triggering backend deploy..."
          curl --fail --silent --show-error -X POST "$BACKEND_HOOK" > /dev/null

          if [ -n "$FRONTEND_HOOK" ]; then
            echo "Triggering frontend deploy..."
            curl --fail --silent --show-error -X POST "$FRONTEND_HOOK" > /dev/null
          else
            echo "::warning::RENDER_FRONTEND_HOOK_URL is not set, skipping frontend deploy"
          fi
