name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Tests
        working-directory: backend
        env:
          GEMINI_API_KEY: "dummy_key"
          MEM0_API_KEY: "dummy_key"
          TELEGRAM_BOT_TOKEN: "dummy_key"
        run: npm test

  deploy:
    name: Trigger Render Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hooks
        run: |
          echo "Triggering Backend Deploy..."
          curl -X POST -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Triggering Frontend Deploy..."
          curl -X POST -s "${{ secrets.RENDER_FRONTEND_HOOK_URL }}"
